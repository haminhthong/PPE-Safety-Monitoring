# Data Contract: Construction PPE Dataset v1
# Specification for PPE annotation semantics, crop dimensions, and anti-leakage split protocol.

dataset_name: construction_ppe_v1
version: "1.0.0"

classes:
  0: helmet
  1: no-helmet
  2: vest
  3: no-vest

annotation_semantics:
  helmet: "Actual helmet / hardhat bounding box located in upper-body/head region."
  no-helmet: "Exposed head or hair region without safety helmet."
  vest: "High-visibility safety vest / reflective clothing bounding box on torso."
  no-vest: "Upper torso region without high-visibility safety vest."

crop_strategy:
  base_detector: "YOLOv8-COCO-Person (Class 0)"
  person_roi_padding_px: 10
  resize_method: "letterbox"
  input_shape: [640, 640]

split_protocol:
  strategy: "group_aware_split"
  group_keys:
    - recording_session
  ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  anti_leakage_rules:
    - "No recording session may span multiple splits."
    - "Exact SHA-256 is rejected; perceptual pHash is recorded for near-duplicate audit."
    - "Ưu tiên test split có camera/góc nhìn chưa xuất hiện trong train khi dữ liệu đáp ứng điều kiện."
