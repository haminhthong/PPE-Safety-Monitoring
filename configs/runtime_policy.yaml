# Runtime policy duy nhất của pipeline online.
# Mọi report phải lưu lại bản cấu hình đã resolve từ file này.

inference_contract:
  person_confidence: 0.30
  ppe_confidence: 0.30
  nms_iou: 0.50
  image_size: 640
  person_roi_padding_px: 10
  person_detection_interval: 1       # Detect người/tracking mỗi frame
  ppe_detection_interval: 4          # PPE inspection mỗi N observation của track

tracking_policy:
  tracker_type: "two_threshold_iou"       # Baseline nội bộ; không gọi là ByteTrack chuẩn
  high_threshold: 0.50                   # Ngưỡng detection cao cho ghép cặp giai đoạn 1
  match_threshold: 0.70                  # Ngưỡng IoU ghép cặp tracking
  low_match_threshold: 0.30
  max_missed_detections: 30              # Số chu kỳ detector bỏ lỡ trước khi xóa track
  track_ttl_seconds: 5.0                 # TTL của track theo thời gian

spatial_association_policy:
  enable_body_zone_filter: true
  head_zone:
    y_min_ratio: 0.00
    y_max_ratio: 0.35                    # Helmet/no-helmet ở 35% phía trên person ROI
  torso_zone:
    y_min_ratio: 0.30
    y_max_ratio: 0.75                    # Vest/no-vest ở vùng 30%-75% của person ROI

decision_policy:
  conflict_margin: 0.10                  # Chênh lệch confidence để giải quyết nhãn xung đột
  violation_confirmations: 3             # Chỉ compatibility cho API cũ
  resolution_confirmations: 3            # Chỉ compatibility cho API cũ
  violation_confirm_seconds: 0.50        # Dwell time xác nhận vi phạm
  resolution_confirm_seconds: 1.00       # Dwell time xác nhận khắc phục
  alert_cooldown_seconds: 10.0           # Thời gian chờ trước cảnh báo tái phạm cùng track
  roi_rule: "center_or_overlap"          # 'center', 'overlap' hoặc kết hợp cả hai
  roi_overlap_threshold: 0.40
